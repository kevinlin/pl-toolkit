[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pl-toolkit"
version = "0.1.0"
description = "A collection of tools for People Leads to perform their duties, including Streamlit dashboards and timesheet processing"
authors = [
    {name = "Kevin Lin", email = "kevin@example.com"}
]
maintainers = [
    {name = "Kevin Lin", email = "kevin@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["timesheet", "streamlit", "people-management", "data-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "PyPDF2>=3.0",
    "streamlit>=1.42",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/username/pl-toolkit"
Repository = "https://github.com/username/pl-toolkit.git"
Documentation = "https://github.com/username/pl-toolkit#readme"
"Bug Tracker" = "https://github.com/username/pl-toolkit/issues"

[project.scripts]
timesheet-review = "timesheet_review:main"
pdf-parser = "pdf_parser:main"
csv-converter = "csv_converter:main"

[tool.hatch.build.targets.wheel]
packages = ["pages"]
only-include = [
    "timesheet_review.py",
    "pdf_parser.py",
    "csv_converter.py",
    "homepage.py",
    "pages",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | input
  | output
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["timesheet_review", "pdf_parser", "csv_converter"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "matplotlib.*",
    "pandas.*",
    "openpyxl.*",
    "PyPDF2.*",

]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "venv/*",
    "*/site-packages/*",
    "input/*",
    "output/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "input",
    "output",
]
